version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zetheta-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zetheta_dev
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c synchronous_commit=off
      -c wal_buffers=32MB
      -c checkpoint_timeout=30min
      -c max_wal_size=2GB
      -c min_wal_size=512MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c work_mem=16MB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:15-alpine
    container_name: zetheta-postgres-replica
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zetheta_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: zetheta-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: zetheta_dev
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 100
      AUTH_TYPE: plain
    ports:
      - "6432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetheta-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@pgbouncer:5432/zetheta_dev
      READ_REPLICA_DATABASE_URL: postgres://postgres:postgrespassword@postgres-replica:5432/zetheta_dev
      TEST_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/zetheta_test
      MERCHANT_API_KEY: merchant-secret-key-67890
      ADMIN_API_KEY: admin-secret-key-12345
      RAZORPAY_WEBHOOK_SECRET: mock-razorpay-secret
      STRIPE_WEBHOOK_SECRET: mock-stripe-secret
      PAYU_WEBHOOK_SECRET: mock-payu-secret
      UPI_WEBHOOK_SECRET: mock-upi-secret
    ports:
      - "3000:3000"

  webhook-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetheta-webhook-worker
    command: ["node", "dist/workers/webhook.worker.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@pgbouncer:5432/zetheta_dev

  reconciliation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetheta-reconciliation-worker
    command: ["node", "dist/workers/reconciliation.worker.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      NODE_ENV: production
      RECONCILIATION_INTERVAL_MINUTES: 60
      DATABASE_URL: postgres://postgres:postgrespassword@pgbouncer:5432/zetheta_dev
      READ_REPLICA_DATABASE_URL: postgres://postgres:postgrespassword@postgres-replica:5432/zetheta_dev

  dashboard:
    image: nginx:alpine
    container_name: zetheta-dashboard
    profiles:
      - dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  pgdata:


