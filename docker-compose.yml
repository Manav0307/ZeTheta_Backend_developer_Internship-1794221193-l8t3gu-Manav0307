version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zetheta-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zetheta_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetheta-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/zetheta_dev
      TEST_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/zetheta_test
      MERCHANT_API_KEY: merchant-secret-key-67890
      ADMIN_API_KEY: admin-secret-key-12345
      RAZORPAY_WEBHOOK_SECRET: mock-razorpay-secret
      STRIPE_WEBHOOK_SECRET: mock-stripe-secret
      PAYU_WEBHOOK_SECRET: mock-payu-secret
      UPI_WEBHOOK_SECRET: mock-upi-secret
    ports:
      - "3000:3000"

  webhook-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetheta-webhook-worker
    command: ["npm", "run", "worker:webhooks"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/zetheta_dev

  reconciliation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetheta-reconciliation-worker
    command: ["npm", "run", "worker:reconcile"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/zetheta_dev

  dashboard:
    image: nginx:alpine
    container_name: zetheta-dashboard
    profiles:
      - dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  pgdata:


