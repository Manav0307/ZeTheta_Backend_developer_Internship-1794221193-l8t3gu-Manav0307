version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zetheta-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zetheta_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetheta-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/zetheta_dev
      TEST_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/zetheta_test
      MERCHANT_API_KEY: test_api_key_zetheta_dev
      ADMIN_API_KEY: admin_secret_key_zetheta
      JWT_SECRET: dev_jwt_super_secret_for_orchestrator_signing_2026
      WEBHOOK_SECRET_RAZORPAY: whsec_rzp_demo_secret_2026
      WEBHOOK_SECRET_STRIPE: whsec_str_demo_secret_2026
      WEBHOOK_SECRET_PAYU: whsec_payu_demo_secret_2026
      WEBHOOK_SECRET_UPI: whsec_upi_demo_secret_2026
    ports:
      - "3000:3000"

volumes:
  pgdata:

